<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking in Tuscany — Vocabolario</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#FAF7F2;
    --paper-dim:#F2ECE2;
    --line:#E2D8C8;
    --ink:#2A2620;
    --ink-soft:#6B6255;
    --brick:#A24B3A;
    --brick-dark:#7E3A2C;
    --sage:#4B5E4A;
    --sage-dark:#354536;
    --sage-light:#EAF0E6;
    --red-light:#F6E4DF;
    --gold:#C9A24B;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:30px 16px 60px;
  }

  .wrap{max-width:680px; margin:0 auto;}

  /* HEADER */
  header{text-align:center; margin-bottom:28px;}
  .eyebrow{
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--brick);
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2rem;
    line-height:1.15;
    margin-bottom:8px;
  }
  .signature{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:0.95rem;
    color:var(--brick);
    margin-bottom:12px;
  }
  .subtitle{
    font-size:0.9rem;
    color:var(--ink-soft);
    max-width:440px;
    margin:0 auto 10px;
    line-height:1.5;
  }
  .word-count{
    font-size:0.8rem;
    color:var(--ink-soft);
    font-weight:600;
  }
  .word-count strong{color:var(--ink);}

  /* CONTROL PANEL */
  .controls{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }

  .controls-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }

  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{
    font-size:0.7rem;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  select{
    font-family:'Inter', sans-serif;
    font-size:0.87rem;
    font-weight:500;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:white;
    color:var(--ink);
    cursor:pointer;
  }
  select:focus{outline:none; border-color:var(--sage);}

  .direction-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:9px 10px;
    background:var(--paper-dim);
    border-radius:8px;
    border:1px solid var(--line);
  }
  .direction-toggle button{
    font-family:'Inter', sans-serif;
    font-size:0.82rem;
    font-weight:600;
    padding:6px 12px;
    border-radius:6px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .direction-toggle button.active{
    background:var(--sage);
    color:white;
  }
  .direction-arrow{color:var(--ink-soft); font-size:0.8rem;}

  /* TABS */
  .tabs{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
    margin-bottom:16px;
  }
  .tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding:12px 4px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    font-family:'Inter', sans-serif;
    font-size:0.72rem;
    font-weight:600;
    transition:all 0.15s;
  }
  .tab svg{width:20px; height:20px; stroke:var(--ink-soft); transition:stroke 0.15s;}
  .tab:hover{border-color:var(--sage);}
  .tab.active{
    background:var(--sage);
    border-color:var(--sage);
    color:white;
  }
  .tab.active svg{stroke:white;}

  /* MAIN PANEL */
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 2px 12px rgba(42,38,32,0.06);
    padding:26px 22px;
    min-height:400px;
  }

  .panel-title{
    font-family:'Fraunces', serif;
    font-size:1.1rem;
    font-weight:600;
    margin-bottom:3px;
  }
  .panel-sub{
    font-size:0.84rem;
    color:var(--ink-soft);
    margin-bottom:22px;
  }

  .btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.88rem;
    padding:12px 16px;
    border-radius:9px;
    border:1px solid var(--ink);
    background:white;
    color:var(--ink);
    cursor:pointer;
    transition:background 0.15s, color 0.15s;
  }
  .btn:hover{background:var(--ink); color:var(--paper);}
  .btn.primary{background:var(--brick); border-color:var(--brick); color:white;}
  .btn.primary:hover{background:var(--brick-dark); border-color:var(--brick-dark);}

  /* FLASHCARD */
  .flash-stage{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .flash-count{font-size:0.8rem; color:var(--ink-soft);}
  .flashcard{width:100%; max-width:400px; height:220px; perspective:1200px; cursor:pointer;}
  .flashcard-inner{
    position:relative; width:100%; height:100%;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    backface-visibility:hidden;
    border-radius:12px;
    padding:20px; text-align:center;
  }
  .flash-face.front{background:var(--sage-dark); color:var(--paper);}
  .flash-face.back{background:var(--paper-dim); color:var(--ink); transform:rotateY(180deg); border:1px solid var(--line);}
  .flash-word{font-family:'Fraunces', serif; font-size:1.85rem; font-weight:600;}
  .flash-hint{font-size:0.75rem; margin-top:10px; opacity:0.7;}

  .flash-know-row{display:flex; gap:10px; width:100%; max-width:400px;}
  .know-btn{
    flex:1;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.88rem;
    padding:12px;
    border-radius:9px;
    border:none;
    cursor:pointer;
  }
  .know-btn.yes{background:var(--sage-light); color:var(--sage-dark);}
  .know-btn.yes:hover{background:#DCE8D6;}
  .know-btn.no{background:var(--red-light); color:var(--brick-dark);}
  .know-btn.no:hover{background:#F0D2C8;}

  .flash-nav-row{display:flex; gap:10px; width:100%; max-width:400px;}
  .flash-nav-row .btn{flex:1;}

  /* QUIZ */
  .quiz-prompt{font-family:'Fraunces', serif; font-size:1.55rem; font-weight:600; margin-bottom:22px; line-height:1.25;}
  .quiz-options{display:flex; flex-direction:column; gap:9px;}
  .quiz-opt{
    text-align:left; padding:13px 15px;
    border:1px solid var(--line); border-radius:9px;
    background:white; font-size:0.92rem; cursor:pointer;
    font-family:'Inter', sans-serif;
    transition:border-color 0.15s, background 0.15s;
  }
  .quiz-opt:hover{border-color:var(--ink);}
  .quiz-opt.correct{border-color:var(--sage); background:var(--sage-light); color:var(--sage-dark); font-weight:600;}
  .quiz-opt.incorrect{border-color:var(--brick); background:var(--red-light); color:var(--brick-dark);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-footer{display:flex; justify-content:space-between; align-items:center; margin-top:20px; font-size:0.83rem; color:var(--ink-soft);}

  /* MATCH */
  .match-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px 12px;}
  .match-item{
    padding:12px 10px; border:1px solid var(--line); border-radius:9px;
    background:white; font-size:0.87rem; text-align:center; cursor:pointer;
    min-height:50px; display:flex; align-items:center; justify-content:center;
    transition:all 0.2s;
  }
  .match-item.target{font-family:'Fraunces', serif; font-weight:600; font-size:0.96rem;}
  .match-item.sel{border-color:var(--gold); border-width:2px; background:#FBF6E9;}
  .match-item.done{border-color:var(--sage); background:var(--sage-light); color:var(--sage-dark); opacity:0.55; cursor:default;}
  .match-item.flash-ok{border-color:var(--sage); background:var(--sage-light);}
  .match-item.flash-no{border-color:var(--brick); background:var(--red-light);}
  .match-stats{display:flex; justify-content:space-between; font-size:0.83rem; color:var(--ink-soft); margin-bottom:14px;}

  /* SPEEDRUN */
  .speed-idle{text-align:center; padding:26px 10px;}
  .speed-explain{font-size:0.9rem; color:var(--ink-soft); max-width:380px; margin:0 auto 22px; line-height:1.5;}
  .speed-record{font-size:0.82rem; color:var(--gold); font-weight:600; margin-bottom:20px;}
  .speed-timer{
    font-family:'Fraunces', serif; font-size:4.2rem; font-weight:700;
    color:var(--brick); line-height:1; text-align:center; margin-bottom:4px;
    font-variant-numeric:tabular-nums; transition:color 0.3s;
  }
  .speed-timer.low{color:#C0392B;}
  .speed-sub{text-align:center; font-size:0.83rem; color:var(--ink-soft); margin-bottom:14px;}
  .speed-progress-track{
    width:100%; height:6px; background:var(--paper-dim);
    border-radius:3px; overflow:hidden; margin-bottom:20px;
  }
  .speed-progress-fill{height:100%; background:var(--sage); transition:width 1s linear;}
  .speed-prompt{
    font-family:'Fraunces', serif; font-size:1.65rem; font-weight:600;
    text-align:center; margin-bottom:18px; min-height:2.2em;
    display:flex; align-items:center; justify-content:center;
  }
  .speed-input-row{display:flex; gap:8px;}
  .speed-input{
    flex:1; font-family:'Inter', sans-serif; font-size:1rem;
    padding:13px 14px; border:1px solid var(--line); border-radius:9px; outline:none;
  }
  .speed-input:focus{border-color:var(--sage);}
  .speed-input.flash-wrong{border-color:var(--brick); background:var(--red-light);}
  .speed-input.flash-right{border-color:var(--sage); background:var(--sage-light);}
  .speed-results{text-align:center; padding:16px 10px;}
  .speed-score{font-family:'Fraunces', serif; font-size:2.8rem; font-weight:700; color:var(--sage-dark); margin-bottom:4px;}
  .speed-score-label{font-size:0.83rem; color:var(--ink-soft); margin-bottom:6px;}
  .speed-new-record{font-size:0.82rem; color:var(--gold); font-weight:700; margin-bottom:18px;}
  .speed-missed{text-align:left; max-width:320px; margin:0 auto 20px; font-size:0.83rem; color:var(--ink-soft);}
  .speed-missed div{padding:4px 0; border-bottom:1px dotted var(--line);}

  @media (max-width:420px){
    h1{font-size:1.65rem;}
    .quiz-prompt{font-size:1.3rem;}
    .speed-timer{font-size:3.2rem;}
    .tab{font-size:0.65rem;}
    .controls-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Study Abroad · OU Arezzo</div>
    <h1>Vocabolario Italiano</h1>
    <div class="signature">Speaking in Tuscany · Antonio Cioni</div>
    <div class="subtitle">Impara le parole di ogni lezione con quattro modalità di ripasso.</div>
    <div class="word-count"><strong id="wordCount">0</strong> parole in questa selezione</div>
  </header>

  <div class="controls">
    <div class="controls-row">
      <div class="field">
        <label for="unitSelect">Capitolo</label>
        <select id="unitSelect"></select>
      </div>
      <div class="field">
        <label for="catSelect">Categoria</label>
        <select id="catSelect"></select>
      </div>
    </div>
    <div class="direction-toggle">
      <button id="dirIT" class="active">Italiano</button>
      <span class="direction-arrow">→</span>
      <button id="dirEN">English</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="flash">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="18" rx="2" transform="rotate(-8 10 14)"/><rect x="7" y="3" width="14" height="18" rx="2"/></svg>
      Flashcard
    </button>
    <button class="tab" data-mode="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
      Quiz
    </button>
    <button class="tab" data-mode="match">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="3"/><circle cx="18" cy="17" r="3"/><path d="M8.5 8.5 15.5 15.5"/></svg>
      Abbina
    </button>
    <button class="tab" data-mode="speed">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13 15 9"/><path d="M9 3h6"/></svg>
      Speedrun
    </button>
  </div>

  <div class="panel" id="panel"></div>
</div>

<script>
/* ============================================================
   DATA — organized by unit → category → array of [target, italiano]
   Each unit corresponds to one lesson handout (30 words each).
   UNIT_ORDER controls menu order; UNIT_LABEL gives display names.
   ============================================================ */

const UNIT_ORDER = ["lez01", "lez02", "numeri"];
const UNIT_LABEL = {
  lez01: "Lezione 1 — Order your gelato",
  lez02: "Lezione 2 — Conoscersi",
  numeri: "Numeri"
};

const DATA = {
  lez01: {
    "Saluti": [
      ["Buongiorno", "buongiorno (formale/mattina)"],
      ["Buonasera", "buonasera (formale/sera)"],
      ["Buona giornata", "buona giornata (augurio)"],
      ["Buona serata", "buona serata (augurio)"],
      ["Arrivederci", "arrivederci (formale)"],
      ["Ciao", "ciao (informale)"]
    ],
    "Al bar": [
      ["Vorrei", "vorrei (formale)"],
      ["Volevo", "volevo (variante di 'vorrei')"],
      ["Per me", "per me / io prendo"],
      ["Io prendo", "io prendo"],
      ["Posso avere...?", "posso avere...?"],
      ["Per favore", "per favore"],
      ["Per piacere", "per piacere"],
      ["Quant'è?", "quanto costa? (per pagare)"],
      ["il caffè", "coffee / espresso"],
      ["il cappuccino", "cappuccino"],
      ["il tavolino", "small table"],
      ["al banco", "at the counter"],
      ["lo scontrino", "receipt"],
      ["il barista", "barista"]
    ],
    "Il gelato": [
      ["il gelato", "ice cream"],
      ["la gelateria", "ice cream shop"],
      ["il cono", "cone"],
      ["la coppetta", "cup (for gelato)"],
      ["Cono o coppetta?", "cone or cup?"],
      ["Da quanto?", "how much / what size?"],
      ["Che gusti?", "which flavors?"],
      ["il gusto", "flavor"],
      ["il cioccolato", "chocolate"],
      ["il pistacchio", "pistachio"],
      ["la fragola", "strawberry"],
      ["il limone", "lemon"],
      ["la nocciola", "hazelnut"],
      ["la vaniglia", "vanilla"],
      ["due gusti", "two flavors"],
      ["la panna", "whipped cream"]
    ]
  },
  lez02: {
    "Conoscersi": [
      ["Come ti chiami?", "what's your name?"],
      ["Mi chiamo...", "my name is..."],
      ["Di dove sei?", "where are you from?"],
      ["Sono di...", "I'm from..."],
      ["Quanti anni hai?", "how old are you?"],
      ["Ho ... anni", "I am ... years old"],
      ["Qual è il tuo indirizzo?", "what's your address?"],
      ["Il mio indirizzo è...", "my address is..."],
      ["Qual è il tuo numero di telefono?", "what's your phone number?"],
      ["Il mio numero di telefono è...", "my phone number is..."],
      ["Come stai?", "how are you? (informal)"],
      ["Bene grazie, e tu?", "fine thanks, and you?"],
      ["Piacere di conoscerti", "nice to meet you"],
      ["Piacere mio", "the pleasure is mine"],
      ["E tu?", "and you?"]
    ],
    "Verbi: essere, avere, stare": [
      ["io sono", "I am"],
      ["tu sei", "you are"],
      ["lui/lei è", "he/she is"],
      ["noi siamo", "we are"],
      ["voi siete", "you all are"],
      ["loro sono", "they are"],
      ["io ho", "I have"],
      ["tu hai", "you have"],
      ["lui/lei ha", "he/she has"],
      ["io sto", "I am (feeling/staying)"],
      ["tu stai", "you are (feeling/staying)"],
      ["noi stiamo", "we are (feeling/staying)"]
    ],
    "Nazionalità": [
      ["americano/americana", "American"],
      ["francese", "French"],
      ["italiano/italiana", "Italian"],
      ["russo/russa", "Russian"],
      ["tedesco/tedesca", "German"],
      ["spagnolo/spagnola", "Spanish"],
      ["inglese", "English"]
    ]
  },
  numeri: {
    "Numeri 1–20": [
      ["uno", "1"],
      ["due", "2"],
      ["tre", "3"],
      ["quattro", "4"],
      ["cinque", "5"],
      ["sei", "6"],
      ["sette", "7"],
      ["otto", "8"],
      ["nove", "9"],
      ["dieci", "10"],
      ["undici", "11"],
      ["dodici", "12"],
      ["tredici", "13"],
      ["quattordici", "14"],
      ["quindici", "15"],
      ["sedici", "16"],
      ["diciassette", "17"],
      ["diciotto", "18"],
      ["diciannove", "19"],
      ["venti", "20"]
    ],
    "Decine 30–100": [
      ["trenta", "30"],
      ["quaranta", "40"],
      ["cinquanta", "50"],
      ["sessanta", "60"],
      ["settanta", "70"],
      ["ottanta", "80"],
      ["novanta", "90"],
      ["cento", "100"]
    ]
  }
};

/* Dedup helper: when "all chapters" is selected, avoid repeated identical
   [target, italiano] pairs across sections. Keyed on target+italiano. */
function dedupMap(pairs){
  const seen = new Set();
  const out = [];
  for(const p of pairs){
    const key = p[0].toLowerCase()+"|"+p[1].toLowerCase();
    if(!seen.has(key)){ seen.add(key); out.push(p); }
  }
  return out;
}

function getUnitCategories(unit){
  if(unit === "ALL"){
    const cats = new Set();
    UNIT_ORDER.forEach(u => Object.keys(DATA[u]).forEach(c => cats.add(c)));
    return ["ALL", ...cats];
  }
  return ["ALL", ...Object.keys(DATA[unit])];
}

function getPairs(unit, cat){
  let pairs = [];
  const units = unit === "ALL" ? UNIT_ORDER : [unit];
  units.forEach(u=>{
    const cats = cat === "ALL" ? Object.keys(DATA[u]) : [cat];
    cats.forEach(c=>{
      if(DATA[u][c]) pairs = pairs.concat(DATA[u][c]);
    });
  });
  return dedupMap(pairs);
}

/* ============================================================
   STATE
   ============================================================ */
let currentUnit = UNIT_ORDER[0];
let currentCat = "ALL";
let direction = "IT"; // IT = target->italiano shown as target, translate to italiano gloss; EN toggle flips which face is "front"
let mode = "flash";

let WORDS = []; // active list of {front, back}

let flashIdx = 0, flashFlipped = false;
let quizQueue = [], quizIdx = 0, quizScore = 0, quizLocked = false;
let matchLeft = [], matchRight = [], matchSelected = null, matchSolved = new Set();
let speedState = "idle", speedTimeLeft = 60, speedTimerHandle = null;
let speedQueue = [], speedIdx = 0, speedCorrect = 0, speedMissed = [];
let speedRecord = 0;

const panel = document.getElementById("panel");
const unitSelect = document.getElementById("unitSelect");
const catSelect = document.getElementById("catSelect");

function populateSelects(){
  unitSelect.innerHTML = UNIT_ORDER.map(u=>`<option value="${u}">${UNIT_LABEL[u]}</option>`).join("")
    + (UNIT_ORDER.length>1 ? `<option value="ALL">Tutti i capitoli</option>` : "");
  unitSelect.value = currentUnit;
  refreshCatSelect();
}
function refreshCatSelect(){
  const cats = getUnitCategories(currentUnit);
  catSelect.innerHTML = cats.map(c=>`<option value="${c}">${c==="ALL"?"Tutte le categorie":c}</option>`).join("");
  catSelect.value = currentCat;
}

function rebuildWords(){
  const pairs = getPairs(currentUnit, currentCat);
  // direction IT: front = italian target word, back = gloss/english
  // direction EN: front = gloss/english, back = italian target word
  WORDS = pairs.map(([target, gloss]) => {
    return direction === "IT"
      ? {front: target, back: gloss}
      : {front: gloss, back: target};
  });
  document.getElementById("wordCount").textContent = WORDS.length;
  flashIdx = 0; flashFlipped = false;
}

unitSelect.addEventListener("change", ()=>{
  currentUnit = unitSelect.value;
  currentCat = "ALL";
  refreshCatSelect();
  rebuildWords();
  resetAllModes();
  render();
});
catSelect.addEventListener("change", ()=>{
  currentCat = catSelect.value;
  rebuildWords();
  resetAllModes();
  render();
});
document.getElementById("dirIT").addEventListener("click", ()=>{
  direction = "IT";
  document.getElementById("dirIT").classList.add("active");
  document.getElementById("dirEN").classList.remove("active");
  rebuildWords(); resetAllModes(); render();
});
document.getElementById("dirEN").addEventListener("click", ()=>{
  direction = "EN";
  document.getElementById("dirEN").classList.add("active");
  document.getElementById("dirIT").classList.remove("active");
  rebuildWords(); resetAllModes(); render();
});

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    mode = tab.dataset.mode;
    if(mode==="quiz") setupQuiz();
    if(mode==="match") setupMatch();
    render();
  });
});

function resetAllModes(){
  setupQuiz();
  setupMatch();
  speedState = "idle";
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ===== FLASHCARD ===== */
function renderFlash(){
  if(WORDS.length===0){ panel.innerHTML = emptyState(); return; }
  const w = WORDS[flashIdx];
  panel.innerHTML = `
    <div class="panel-title">Flashcard</div>
    <div class="panel-sub">Tocca la carta per girarla</div>
    <div class="flash-stage">
      <div class="flash-count">${flashIdx+1} / ${WORDS.length}</div>
      <div class="flashcard ${flashFlipped?'flipped':''}" id="fc">
        <div class="flashcard-inner">
          <div class="flash-face front">
            <div class="flash-word">${w.front}</div>
          </div>
          <div class="flash-face back">
            <div class="flash-word">${w.back}</div>
          </div>
        </div>
      </div>
      <div class="flash-know-row">
        <button class="know-btn no" id="knowNo">Non so</button>
        <button class="know-btn yes" id="knowYes">So</button>
      </div>
      <div class="flash-nav-row">
        <button class="btn" id="fcPrev">← Indietro</button>
        <button class="btn primary" id="fcNext">Avanti →</button>
      </div>
    </div>
  `;
  document.getElementById("fc").onclick = ()=>{ flashFlipped=!flashFlipped; renderFlash(); };
  const advance = ()=>{ flashIdx=(flashIdx+1)%WORDS.length; flashFlipped=false; renderFlash(); };
  document.getElementById("knowYes").onclick=(e)=>{ e.stopPropagation(); advance(); };
  document.getElementById("knowNo").onclick=(e)=>{ e.stopPropagation(); advance(); };
  document.getElementById("fcPrev").onclick=(e)=>{
    e.stopPropagation();
    flashIdx=(flashIdx-1+WORDS.length)%WORDS.length; flashFlipped=false; renderFlash();
  };
  document.getElementById("fcNext").onclick=(e)=>{ e.stopPropagation(); advance(); };
}

/* ===== QUIZ ===== */
function setupQuiz(){
  quizQueue = shuffle(WORDS);
  quizIdx = 0; quizScore = 0; quizLocked = false;
}
function renderQuiz(){
  if(WORDS.length<4){ panel.innerHTML = emptyState("Servono almeno 4 parole per il quiz."); return; }
  if(quizIdx >= quizQueue.length){
    panel.innerHTML = `
      <div class="panel-title">Quiz completato</div>
      <div class="panel-sub">Hai risposto a tutte le ${quizQueue.length} parole</div>
      <div class="speed-score">${quizScore}/${quizQueue.length}</div>
      <div class="speed-score-label">risposte corrette</div>
      <button class="btn primary" id="quizRestart">Ricomincia</button>
    `;
    document.getElementById("quizRestart").onclick = ()=>{ setupQuiz(); render(); };
    return;
  }
  const current = quizQueue[quizIdx];
  const wrongPool = shuffle(WORDS.filter(w=>w.front!==current.front)).slice(0,3);
  const options = shuffle([current, ...wrongPool]);
  quizLocked = false;
  panel.innerHTML = `
    <div class="panel-title">Quiz</div>
    <div class="panel-sub">Scegli la traduzione corretta</div>
    <div class="quiz-prompt">${current.front}</div>
    <div class="quiz-options">
      ${options.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${o.back}</button>`).join("")}
    </div>
    <div class="quiz-footer">
      <span>${quizIdx+1} / ${quizQueue.length}</span>
      <span>Punteggio: ${quizScore}</span>
    </div>
  `;
  panel.querySelectorAll(".quiz-opt").forEach((btn,i)=>{
    btn.onclick=()=>{
      if(quizLocked) return;
      quizLocked = true;
      const chosen = options[i];
      const correctBtn = [...panel.querySelectorAll(".quiz-opt")][options.findIndex(o=>o.front===current.front)];
      if(chosen.front === current.front){ btn.classList.add("correct"); quizScore++; }
      else { btn.classList.add("incorrect"); correctBtn.classList.add("correct"); }
      panel.querySelectorAll(".quiz-opt").forEach(b=>b.disabled=true);
      setTimeout(()=>{ quizIdx++; renderQuiz(); }, 900);
    };
  });
}

/* ===== MATCH ===== */
function setupMatch(){
  const n = Math.min(6, WORDS.length);
  const set = shuffle(WORDS).slice(0,n);
  matchLeft = shuffle(set.map(w=>({key:w.front, text:w.front})));
  matchRight = shuffle(set.map(w=>({key:w.front, text:w.back})));
  matchSelected = null;
  matchSolved = new Set();
}
function renderMatch(){
  if(WORDS.length<2){ panel.innerHTML = emptyState("Servono almeno 2 parole per l'abbinamento."); return; }
  panel.innerHTML = `
    <div class="panel-title">Abbina</div>
    <div class="panel-sub">Collega ogni parola alla sua traduzione</div>
    <div class="match-stats"><span>${matchSolved.size} / ${matchLeft.length} abbinate</span><span></span></div>
    <div class="match-grid" id="matchGrid"></div>
    ${matchSolved.size===matchLeft.length && matchLeft.length>0 ? `<div style="margin-top:16px;"><button class="btn primary" id="matchNew">Nuovo set</button></div>` : ""}
  `;
  const grid = document.getElementById("matchGrid");
  for(let i=0;i<matchLeft.length;i++){
    const l = matchLeft[i], r = matchRight[i];
    const lDiv = document.createElement("div");
    lDiv.className = `match-item target ${matchSolved.has(l.key)?'done':''} ${matchSelected===l.key?'sel':''}`;
    lDiv.dataset.side="L"; lDiv.dataset.key=l.key; lDiv.textContent=l.text;
    const rDiv = document.createElement("div");
    rDiv.className = `match-item ${matchSolved.has(r.key)?'done':''}`;
    rDiv.dataset.side="R"; rDiv.dataset.key=r.key; rDiv.textContent=r.text;
    grid.appendChild(lDiv); grid.appendChild(rDiv);
  }
  grid.querySelectorAll(".match-item").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.dataset.key, side = el.dataset.side;
      if(matchSolved.has(key)) return;
      if(side==="L"){
        matchSelected = (matchSelected===key) ? null : key;
        renderMatch();
      } else {
        if(!matchSelected) return;
        if(matchSelected === key){
          matchSolved.add(key);
          el.classList.add("flash-ok");
          const leftEl = grid.querySelector(`.match-item[data-side="L"][data-key="${key}"]`);
          if(leftEl) leftEl.classList.add("flash-ok");
          matchSelected = null;
          setTimeout(renderMatch, 300);
        } else {
          el.classList.add("flash-no");
          setTimeout(()=>{ el.classList.remove("flash-no"); }, 400);
        }
      }
    });
  });
  const newBtn = document.getElementById("matchNew");
  if(newBtn) newBtn.onclick = ()=>{ setupMatch(); renderMatch(); };
}

/* ===== SPEEDRUN ===== */
function speedRecordKey(){ return `speedrun_record_${currentUnit}_${currentCat}_${direction}`; }
function loadRecord(){
  try{ speedRecord = parseInt(sessionStorage.getItem(speedRecordKey())||"0",10); }
  catch(e){ speedRecord = 0; }
}
function saveRecord(score){
  if(score > speedRecord){
    speedRecord = score;
    try{ sessionStorage.setItem(speedRecordKey(), String(score)); }catch(e){}
    return true;
  }
  return false;
}
function renderSpeed(){
  if(WORDS.length===0){ panel.innerHTML = emptyState(); return; }
  loadRecord();
  if(speedState==="idle"){
    panel.innerHTML = `
      <div class="panel-title">Speedrun</div>
      <div class="speed-idle">
        <div class="speed-explain">60 secondi. Scrivi la traduzione il più velocemente possibile. Premi Invio per confermare ogni risposta.</div>
        ${speedRecord>0 ? `<div class="speed-record">Record attuale: ${speedRecord}</div>` : ""}
        <button class="btn primary" id="speedStart">Comincia</button>
      </div>
    `;
    document.getElementById("speedStart").onclick = startSpeed;
    return;
  }
  if(speedState==="running"){
    const current = speedQueue[speedIdx % speedQueue.length];
    const pct = (speedTimeLeft/60)*100;
    panel.innerHTML = `
      <div class="speed-timer ${speedTimeLeft<=10?'low':''}">${speedTimeLeft}</div>
      <div class="speed-sub">secondi rimasti · ${speedCorrect} corrette</div>
      <div class="speed-progress-track"><div class="speed-progress-fill" style="width:${pct}%"></div></div>
      <div class="speed-prompt">${current.front}</div>
      <div class="speed-input-row">
        <input type="text" class="speed-input" id="speedInput" placeholder="scrivi la traduzione..." autocomplete="off">
      </div>
    `;
    const input = document.getElementById("speedInput");
    input.focus();
    input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") checkSpeedAnswer(input.value, current); });
    return;
  }
  if(speedState==="done"){
    const isNew = saveRecord(speedCorrect);
    panel.innerHTML = `
      <div class="panel-title">Tempo scaduto!</div>
      <div class="speed-results">
        <div class="speed-score">${speedCorrect}</div>
        <div class="speed-score-label">parole corrette in 60 secondi</div>
        ${isNew ? `<div class="speed-new-record">Nuovo record!</div>` : `<div class="speed-score-label">Record: ${speedRecord}</div>`}
        ${speedMissed.length ? `
          <div class="speed-missed">
            <strong style="font-size:0.83rem;">Da ripassare:</strong>
            ${speedMissed.map(w=>`<div>${w.front} — ${w.back}</div>`).join("")}
          </div>` : ""}
        <button class="btn primary" id="speedAgain">Ripeti</button>
      </div>
    `;
    document.getElementById("speedAgain").onclick = ()=>{ speedState="idle"; renderSpeed(); };
  }
}
function startSpeed(){
  speedState = "running";
  speedTimeLeft = 60;
  speedQueue = shuffle(WORDS);
  speedIdx = 0; speedCorrect = 0; speedMissed = [];
  renderSpeed();
  speedTimerHandle = setInterval(()=>{
    speedTimeLeft--;
    if(speedTimeLeft<=0){
      clearInterval(speedTimerHandle);
      speedState = "done";
      renderSpeed();
    } else {
      const timerEl = panel.querySelector(".speed-timer");
      const subEl = panel.querySelector(".speed-sub");
      const fillEl = panel.querySelector(".speed-progress-fill");
      if(timerEl){ timerEl.textContent = speedTimeLeft; timerEl.classList.toggle("low", speedTimeLeft<=10); }
      if(subEl) subEl.textContent = `secondi rimasti · ${speedCorrect} corrette`;
      if(fillEl) fillEl.style.width = (speedTimeLeft/60*100)+"%";
    }
  }, 1000);
}
function checkSpeedAnswer(value, current){
  const input = document.getElementById("speedInput");
  const norm = s => s.toLowerCase().trim().replace(/^(to |the |a |an |il |lo |la |i |gli |le |l')/,"").replace(/[.,!?']/g,"");
  const guess = norm(value);
  const answerVariants = current.back.split(/[\/(]/)[0].split(",").map(s=>norm(s));
  const isRight = answerVariants.some(a => a===guess || (guess.length>2 && a.includes(guess)));
  if(isRight){ speedCorrect++; input.classList.add("flash-right"); }
  else { speedMissed.push(current); input.classList.add("flash-wrong"); }
  setTimeout(()=>{
    if(speedState!=="running") return;
    speedIdx++;
    input.value="";
    input.classList.remove("flash-right","flash-wrong");
    const current2 = speedQueue[speedIdx % speedQueue.length];
    const promptEl = panel.querySelector(".speed-prompt");
    if(promptEl) promptEl.textContent = current2.front;
    input.focus();
  }, 350);
}

function emptyState(msg){
  return `<div class="panel-title">Nessuna parola</div><div class="panel-sub">${msg || "Seleziona un capitolo o una categoria con parole disponibili."}</div>`;
}

/* ===== RENDER DISPATCH ===== */
function render(){
  if(mode==="flash") renderFlash();
  if(mode==="quiz") renderQuiz();
  if(mode==="match") renderMatch();
  if(mode==="speed") renderSpeed();
}

populateSelects();
rebuildWords();
resetAllModes();
render();
</script>
